name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, release, and update tap
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: tag must be vX.Y.Z (got: $GITHUB_REF_NAME)" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build app bundle
        run: VERSION="$VERSION" ./scripts/build-app.sh release

      - name: Package zip
        run: ditto -c -k --keepParent build/Kakico.app "Kakico-${VERSION}.zip"

      - name: Sanity-check zip round-trip
        run: |
          ditto -x -k "Kakico-${VERSION}.zip" /tmp/unzip-check
          codesign --verify --verbose=2 /tmp/unzip-check/Kakico.app
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
            /tmp/unzip-check/Kakico.app/Contents/Info.plist | grep -qx "$VERSION"

      # Immutable releases are enabled on this repo: once published, assets and
      # the tag are locked, so the asset must be attached while the release is
      # still a draft. Publishing is the last, irreversible step — a deleted
      # immutable release's tag name can never be reused; recover from a bad
      # release with a new patch tag, not by re-tagging.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --draft \
              --title "Kakico ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
          if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = "true" ]; then
            # Draft is still mutable: ensure the asset is attached (clobber
            # replaces a partial upload from a failed run), then publish.
            gh release upload "$GITHUB_REF_NAME" "Kakico-${VERSION}.zip" --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false
          else
            echo "release $GITHUB_REF_NAME already published, skipping"
          fi

      # The cask sha256 must match the published asset, not the local build:
      # builds are not byte-reproducible, so on a re-run the freshly built zip
      # differs from the already-released one.
      - name: Compute sha256 of published asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" \
            --pattern "Kakico-${VERSION}.zip" --dir /tmp/published
          echo "SHA256=$(shasum -a 256 "/tmp/published/Kakico-${VERSION}.zip" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          git clone --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/tk3fftk/homebrew-tap.git" tap
          cd tap
          sed -i '' -E "s|^  version \".*\"$|  version \"${VERSION}\"|" Casks/kakico.rb
          sed -i '' -E "s|^  sha256 \".*\"$|  sha256 \"${SHA256}\"|" Casks/kakico.rb
          # BSD sed exits 0 even when the pattern does not match; verify the
          # expected values actually landed before committing.
          grep -q "^  version \"${VERSION}\"$" Casks/kakico.rb
          grep -q "^  sha256 \"${SHA256}\"$" Casks/kakico.rb
          if git diff --quiet; then
            echo "cask already up to date, nothing to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "kakico ${VERSION}"
            git push
          fi
