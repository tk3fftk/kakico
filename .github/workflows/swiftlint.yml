name: SwiftLint

on:
  pull_request:

permissions:
  contents: read

env:
  SWIFTLINT_VERSION: "0.63.3"
  SWIFTLINT_SHA256: "26db741d43f2f2dc26c0cf16911100a3e186c3d1dbb59e55ad3ac87b0de4538f"

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache SwiftLint binary
        id: cache-swiftlint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/swiftlint
          key: swiftlint-${{ env.SWIFTLINT_VERSION }}-linux-amd64

      - name: Download SwiftLint
        if: steps.cache-swiftlint.outputs.cache-hit != 'true'
        run: |
          curl -sL "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_amd64.zip" -o /tmp/swiftlint.zip
          echo "${SWIFTLINT_SHA256}  /tmp/swiftlint.zip" | sha256sum -c
          unzip -o /tmp/swiftlint.zip -d /tmp/swiftlint
          chmod +x /tmp/swiftlint/swiftlint

      - name: Run SwiftLint
        run: /tmp/swiftlint/swiftlint --strict --reporter github-actions-logging
